<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
</head>
<body>

<form>

    Name:
    <input type="text"><br><br>

    Semester:
    <input type="number"><br><br>

    Gender:
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <br><br>

    Subject:
    <select>
        <option>HTML</option>
        <option>Java</option>
        <option>Python</option>
    </select>
    <br><br>

    Skills:
    <input type="checkbox"> HTML
    <br><br>

    <input type="submit" value="Submit">

</form>

</body>
</html>
